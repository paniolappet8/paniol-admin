name: Deploy modified PWA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect modified applications
        id: apps
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"

          if echo "$changed" | grep -q '^dist-admin/'; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -q '^dist-docente/'; then
            echo "docente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy admin
        if: steps.apps.outputs.admin == 'true'
        run: curl -fsS -X POST "$NETLIFY_DEPLOY_ADMIN"
        env:
          NETLIFY_DEPLOY_ADMIN: ${{ secrets.NETLIFY_DEPLOY_ADMIN }}

      - name: Deploy docente
        if: steps.apps.outputs.docente == 'true'
        run: curl -fsS -X POST "$NETLIFY_DEPLOY_DOCENTE"
        env:
          NETLIFY_DEPLOY_DOCENTE: ${{ secrets.NETLIFY_DEPLOY_DOCENTE }}

      - name: No deployment needed
        if: steps.apps.outputs.admin != 'true' && steps.apps.outputs.docente != 'true'
        run: echo "No PWA build changed"